<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Container with subtle border -->
  <rect width="800" height="130" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
  
  <!-- Top glow accent line -->
  <line x1="80" y1="1" x2="720" y2="1" stroke="url(#accent)" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f0f6fc" letter-spacing="1">
    Ta Tan Phong
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#38bdf8" letter-spacing="0.5">
    Software Engineering Student • Java &amp; Backend Developer
  </text>
  
  <!-- Bottom glow accent line -->
  <line x1="150" y1="129" x2="650" y2="129" stroke="url(#accent)" stroke-width="1.5"/>
</svg>
